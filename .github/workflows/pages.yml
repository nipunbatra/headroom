name: Publish website
on:
  push:
    branches: [main]
    paths: ['docs/index.html', 'docs/site.css', 'images/headroom-*.png', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Assemble public website
        run: |
          mkdir -p _site/images
          cp docs/index.html docs/site.css _site/
          cp images/headroom-{icon,overview,large-files,cleanup-review}.png _site/images/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
